<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GP Survey · Round 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  :root{
    /* ── KRAFTON RED (브랜드 정확값이 있으면 이 한 줄만 교체) ── */
    --accent:#E4002B; --accent-deep:#B3001F; --accent-soft:#FCE4E8;
    --bg:#F2F3F5; --surface:#FFFFFF; --surface-2:#F7F8FA;
    --ink:#1A1A1F; --ink-soft:#5A5E68; --ink-faint:#9298A2;
    --line:#E4E6EA; --line-soft:#EFF1F4; --danger:#C8102E; --amber:#E8A33D; --blue:#3B82F6;
    --shadow:0 1px 2px rgba(26,26,31,.04), 0 8px 28px rgba(26,26,31,.07);
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);}
  #app{font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Hiragino Sans","Microsoft YaHei","Malgun Gothic",sans-serif;
    color:var(--ink);max-width:480px;margin:0 auto;padding:0 0 40px;-webkit-font-smoothing:antialiased;line-height:1.6;}

  .topbar{position:sticky;top:0;z-index:20;background:rgba(242,243,245,.88);backdrop-filter:blur(10px);padding:12px 18px 11px;border-bottom:1px solid var(--line);}
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px;letter-spacing:.2px;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .langsw{display:flex;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;}
  .langsw button{border:none;background:none;font-family:inherit;font-size:11.5px;font-weight:700;color:var(--ink-faint);padding:4px 9px;border-radius:999px;cursor:pointer;transition:.15s;}
  .langsw button.on{background:var(--accent);color:#fff;}
  .timer{font-size:11.5px;font-weight:600;color:var(--ink-soft);font-variant-numeric:tabular-nums;}

  .progress{display:flex;align-items:center;margin-top:11px;padding:0 2px;}
  .pnode{flex:0 0 auto;}
  .pdot{width:10px;height:10px;border-radius:50%;background:var(--line);border:2px solid var(--bg);transition:.35s;position:relative;z-index:2;}
  .pnode.done .pdot{background:var(--accent);}
  .pnode.current .pdot{background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
  .pline{flex:1 1 auto;height:2px;background:var(--line);position:relative;z-index:1;}
  .pline .fill{position:absolute;inset:0;width:0;background:var(--accent);transition:.45s;}

  .testbar{background:#FFF4D6;border-bottom:1px solid #F0DFA8;color:#7A5A12;font-size:11.5px;font-weight:700;text-align:center;padding:7px 14px;}

  .page{padding:22px 20px 0;animation:rise .4s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .sec-eyebrow{font-size:12px;font-weight:800;color:var(--accent-deep);letter-spacing:.6px;text-transform:uppercase;}
  .sec-title{font-size:22px;font-weight:800;letter-spacing:-.4px;margin:5px 0 0;line-height:1.34;}
  .sec-desc{font-size:14px;color:var(--ink-soft);margin:12px 0 0;}
  .group-head{font-size:15px;font-weight:800;margin:26px 0 2px;display:flex;align-items:center;gap:8px;}
  .group-head:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent);}
  .note{font-size:13px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:11px 14px;margin:16px 0 0;}

  .q{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 16px;margin-top:14px;box-shadow:var(--shadow);transition:border-color .2s;}
  .q.missing{border-color:var(--danger);animation:shake .3s;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .q-num{font-size:11px;font-weight:800;color:var(--accent-deep);letter-spacing:.5px;}
  .q-opt{font-size:11px;font-weight:700;color:var(--ink-faint);margin-left:6px;}
  .q-text{font-size:15.5px;font-weight:600;letter-spacing:-.2px;margin:4px 0 0;line-height:1.5;}
  .q-tip{font-size:12.5px;color:var(--ink-soft);margin:8px 0 0;background:var(--surface-2);border-radius:9px;padding:8px 11px;}

  .scale{display:flex;gap:7px;margin-top:14px;}
  .scale button{flex:1;border:1.5px solid var(--line);background:var(--surface);border-radius:13px;padding:13px 0;font-size:16px;font-weight:700;color:var(--ink-soft);cursor:pointer;font-family:inherit;transition:.15s;}
  .scale button:hover{border-color:var(--accent);}
  .scale button.on{background:var(--accent);border-color:var(--accent);color:#fff;transform:translateY(-1px);box-shadow:0 6px 14px rgba(228,0,43,.3);}
  .anchors{display:flex;justify-content:space-between;margin-top:9px;font-size:11.5px;color:var(--ink-faint);font-weight:500;gap:10px;}
  .anchors span{max-width:46%;}
  .anchors span:last-child{text-align:right;}
  .nps{display:grid;grid-template-columns:repeat(11,1fr);gap:5px;margin-top:14px;}
  .nps button{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 0;font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;font-family:inherit;transition:.12s;}
  .nps button.on{background:var(--accent);border-color:var(--accent);color:#fff;}

  .opt{display:flex;align-items:flex-start;gap:11px;border:1.5px solid var(--line);background:var(--surface);border-radius:13px;padding:12px 14px;margin-top:9px;cursor:pointer;font-size:14.5px;font-weight:500;color:var(--ink);transition:.15s;line-height:1.45;}
  .opt:hover{border-color:var(--accent);background:var(--surface-2);}
  .opt.on{border-color:var(--accent);background:var(--accent-soft);}
  .opt.disabled{opacity:.4;pointer-events:none;}
  .tick{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);margin-top:1px;display:flex;align-items:center;justify-content:center;transition:.15s;}
  .tick.sq{border-radius:6px;}
  .opt.on .tick{border-color:var(--accent);background:var(--accent);}
  .opt.on .tick:after{content:"";width:9px;height:9px;border-radius:50%;background:#fff;}
  .opt.on .tick.sq:after{content:"";width:5px;height:9px;border:2px solid #fff;border-top:0;border-left:0;border-radius:1px;transform:rotate(42deg) translateY(-1px);background:none;}
  .maxhint{font-size:11.5px;color:var(--ink-faint);font-weight:600;margin-top:10px;}

  textarea,input[type=text],input[type=tel],input[type=password]{width:100%;font-family:inherit;font-size:14.5px;color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px;resize:vertical;line-height:1.55;}
  textarea:focus,input:focus{outline:none;border-color:var(--accent);background:var(--surface);}
  textarea{min-height:84px;}
  .subinput{margin-top:0;}
  .cond-note{font-size:11.5px;color:var(--ink-faint);margin:14px 0 -2px;display:flex;align-items:center;gap:6px;}
  .cond-note:before{content:"\u21B3";color:var(--accent);font-weight:700;}

  .hero{background:linear-gradient(160deg,var(--accent),var(--accent-deep));color:#fff;border-radius:22px;padding:26px 22px 24px;margin-top:8px;box-shadow:0 14px 30px rgba(179,0,31,.28);}
  .hero h1{font-size:25px;font-weight:800;letter-spacing:-.5px;margin:0;line-height:1.3;}
  .hero p{font-size:14px;opacity:.94;margin:12px 0 0;line-height:1.65;}
  .meta{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px;margin-top:16px;box-shadow:var(--shadow);}
  .meta-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line-soft);font-size:14px;gap:12px;}
  .meta-row:last-child{border-bottom:0;}
  .meta-row .k{color:var(--ink-soft);font-weight:500;flex:0 0 auto;} .meta-row .v{font-weight:700;text-align:right;}
  .reward-card{background:var(--accent-soft);border:1px solid #F4C4CE;border-radius:16px;padding:16px 18px;margin-top:14px;}
  .reward-card h3{margin:0;font-size:14.5px;font-weight:800;color:var(--accent-deep);}
  .reward-card p{margin:8px 0 0;font-size:13.5px;color:#8A2030;line-height:1.6;}
  .assure{font-size:12.5px;color:var(--ink-soft);margin-top:16px;line-height:1.6;}
  .contact{font-size:12.5px;color:var(--ink-faint);margin-top:14px;}

  .ways{counter-reset:w;margin:14px 0 0;padding:0;list-style:none;}
  .ways li{counter-increment:w;display:flex;gap:11px;align-items:flex-start;font-size:13.5px;font-weight:500;padding:9px 0;border-bottom:1px solid var(--line-soft);}
  .ways li:last-child{border-bottom:0;}
  .ways li:before{content:counter(w);flex:0 0 auto;width:22px;height:22px;border-radius:7px;background:var(--accent-soft);color:var(--accent-deep);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;}

  .nav{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 26%);padding:18px 20px 22px;margin-top:26px;display:flex;gap:10px;}
  .btn{flex:1;border:none;border-radius:14px;padding:15px 0;font-size:15.5px;font-weight:800;font-family:inherit;cursor:pointer;transition:.18s;}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 8px 20px rgba(228,0,43,.3);}
  .btn-primary:hover{background:var(--accent-deep);}
  .btn-primary:disabled{opacity:.6;cursor:default;}
  .btn-ghost{flex:0 0 92px;background:var(--surface);color:var(--ink-soft);border:1.5px solid var(--line);box-shadow:none;}
  .btn-ghost:hover{border-color:var(--ink-faint);}

  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.3s;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:88%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .done-hero{text-align:center;padding:54px 8px 0;}
  .done-mark{width:72px;height:72px;border-radius:50%;background:var(--accent-soft);margin:0 auto;display:flex;align-items:center;justify-content:center;}
  .done-mark:after{content:"";width:18px;height:32px;border:4px solid var(--accent);border-top:0;border-left:0;border-radius:2px;transform:rotate(42deg) translateY(-3px);}
  .done-hero h1{font-size:23px;font-weight:800;margin:20px 0 0;letter-spacing:-.4px;}
  .done-hero p{font-size:14px;color:var(--ink-soft);margin:10px 0 0;line-height:1.6;}
  .done-link{display:inline-block;margin-top:26px;font-size:13px;font-weight:700;color:var(--ink-faint);cursor:pointer;padding:8px 16px;border:1px solid var(--line);border-radius:999px;}
  .admin-link{text-align:center;font-size:12px;font-weight:600;color:var(--ink-faint);margin-top:26px;cursor:pointer;padding:8px;}
  .admin-link:hover{color:var(--accent-deep);}
  .logout{font-size:12px;font-weight:700;color:var(--ink-soft);cursor:pointer;}
  .login-wrap{text-align:center;padding:48px 8px 0;}
  .login-ico{width:58px;height:58px;border-radius:16px;background:var(--ink);margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:26px;}
  .login-wrap h1{font-size:21px;font-weight:800;margin:0;}
  .login-wrap p{font-size:13px;color:var(--ink-soft);margin:8px 0 0;}
  .dash-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;}
  .dcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px 16px;box-shadow:var(--shadow);}
  .dcard .dl{font-size:11.5px;font-weight:700;color:var(--ink-soft);}
  .dcard .dn{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-top:4px;font-variant-numeric:tabular-nums;}
  .dcard .ds{font-size:11px;color:var(--ink-faint);margin-top:2px;}
  .dcard.span2{grid-column:span 2;}
  .nps-big{display:flex;align-items:baseline;gap:10px;}
  .nps-big .v{font-size:30px;font-weight:800;color:var(--accent-deep);}
  .nps-seg{display:flex;height:9px;border-radius:5px;overflow:hidden;margin-top:10px;}
  .nps-seg span{display:block;height:100%;}
  .nps-legend{display:flex;gap:14px;font-size:11px;color:var(--ink-soft);margin-top:8px;}
  .nps-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;}
  .filters{display:flex;gap:8px;margin-top:16px;}
  .filters select{flex:1;font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;}
  .dash-sec{font-size:12px;font-weight:800;color:var(--accent-deep);letter-spacing:.5px;text-transform:uppercase;margin:26px 0 0;}
  .dq{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-top:12px;box-shadow:var(--shadow);}
  .dq .dqt{font-size:13.5px;font-weight:700;line-height:1.45;}
  .dq .dqn{font-size:11px;font-weight:800;color:var(--accent-deep);}
  .dq .dqmeta{font-size:11.5px;color:var(--ink-faint);font-weight:600;margin-top:2px;}
  .bar{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:12.5px;}
  .bar-l{flex:0 0 32%;color:var(--ink-soft);font-weight:500;line-height:1.3;word-break:keep-all;}
  .bar-l.wide{flex:0 0 48%;}
  .bar-track{flex:1;height:18px;background:var(--surface-2);border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--accent);border-radius:6px;transition:width .5s;min-width:2px;}
  .bar-v{flex:0 0 auto;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;min-width:58px;text-align:right;}
  .empty-q{font-size:12.5px;color:var(--ink-faint);font-style:italic;margin-top:8px;}
  .dash-actions{display:flex;gap:8px;margin-top:24px;}
  .abtn{flex:1;border:1.5px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:12px;padding:12px 0;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;}
  .abtn:hover{border-color:var(--accent);color:var(--accent-deep);}
  .secnote{font-size:11.5px;color:var(--ink-faint);line-height:1.6;margin-top:16px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:11px 14px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ===================================================================
   GP 서베이 1회차 — GitHub Pages 배포용
   배포 전 아래 SCRIPT_URL 한 줄만 본인 Apps Script 웹앱 URL로 교체하세요.
   (비워두면 '테스트 모드'로 동작하며 시트로 전송하지 않습니다.)
=================================================================== */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxBzGhltsT1-S1OIXfEsGzuu11RnHjwAaz-Gp23lN3lIl5e3-kTpFeKZ9BgmAcFirE7/exec";
const TEST_MODE = !SCRIPT_URL || SCRIPT_URL.indexOf("PASTE_YOUR")===0;

/* 관리자 모드 — 인트로 하단 '🔒 관리자 모드' 링크로 진입, 비번 입력 후 대시보드.
   비번은 공개 페이지 특성상 '가벼운 칸막이'이며, 보상 연락처·자유응답 원문은
   대시보드로 전송되지 않고 권한 걸린 시트에만 남습니다.
   DASH_KEY 는 Code.gs 의 DASH_KEY 와 반드시 동일해야 합니다.            */
const ADMIN_PW = "gp2026";
const DASH_KEY = "gp-dash-2026";


/* =================== 문항 구조 (언어 무관) =================== */
/* type: scale | nps | single | single_other | multi | multi_other | text | text_one
   other:true 면 마지막에 '기타' 입력 옵션 추가 (index = opts.length)
   showIf: 분기 노출 조건 (인덱스/숫자 기반이라 언어와 무관)               */
const STRUCT=[
  {id:"s0",items:[
    {t:"q",id:"Q1",type:"single"},
    {t:"q",id:"Q2",type:"single"},
  ]},
  {id:"s1",note:true,items:[
    {t:"q",id:"Q3",type:"scale"},{t:"q",id:"Q4",type:"scale"},{t:"q",id:"Q5",type:"scale"},
    {t:"q",id:"Q6",type:"scale"},{t:"q",id:"Q7",type:"scale"},{t:"q",id:"Q8",type:"scale"},
    {t:"q",id:"Q9",type:"scale"},{t:"q",id:"Q10",type:"scale"},{t:"q",id:"Q11",type:"scale"},
    {t:"q",id:"Q12",type:"scale"},
  ]},
  {id:"s2",items:[
    {t:"q",id:"Q13",type:"single_other",other:true},
    {t:"head",key:"nl"},
    {t:"q",id:"Q14",type:"scale"},
    {t:"q",id:"Q14_1",type:"single_other",optional:true,other:true,showIf:a=>typeof a.Q14==="number"&&a.Q14<=2},
    {t:"q",id:"Q15",type:"nps"},
    {t:"q",id:"Q16",type:"multi",max:3},
    {t:"q",id:"Q17",type:"text",optional:true},
    {t:"head",key:"slack"},
    {t:"q",id:"Q18",type:"scale"},
    {t:"q",id:"Q19",type:"scale"},
    {t:"q",id:"Q19_1",type:"single_other",optional:true,other:true,showIf:a=>typeof a.Q19==="number"&&a.Q19<=2},
    {t:"q",id:"Q20",type:"scale"},
  ]},
  {id:"s3",items:[
    {t:"q",id:"Q21",type:"scale"},
    {t:"q",id:"Q22",type:"multi"},
    {t:"q",id:"Q23",type:"scale"},
    {t:"q",id:"Q24",type:"scale"},
  ]},
  {id:"s4",items:[
    {t:"q",id:"Q25",type:"scale"},
    {t:"q",id:"Q26",type:"multi",max:3},
    {t:"q",id:"Q27",type:"multi_other",other:true},
    {t:"q",id:"Q28",type:"text",optional:true},
    {t:"q",id:"Q29",type:"text",optional:true},
    {t:"q",id:"Q30",type:"text",optional:true},
  ]},
  {id:"reward",items:[
    {t:"q",id:"Q31",type:"single",optional:true},
    {t:"q",id:"Q31_hq",type:"text_one",optional:true,showIf:a=>a.Q31===0},
    {t:"q",id:"Q31_ov",type:"text_one",optional:true,showIf:a=>a.Q31===1},
  ]},
];
const TARGET=76;
const QLBL={Q14_1:"Q14-1",Q19_1:"Q19-1",Q31_hq:"Q31-1(HQ)",Q31_ov:"Q31-1(해외)"};
const qLabel=id=>QLBL[id]||id;
function findItem(id){for(const s of STRUCT)for(const it of s.items)if(it.t==="q"&&it.id===id)return it;}

/* =================== 다국어 텍스트 =================== */
const I18N={
ko:{
  name:"한국어",
  ui:{title:"GP 서베이 · 1회차",start:"설문 시작하기",next:"다음",prev:"이전",submit:"제출하기",saving:"전송 중…",
    doneTitle:"응답이 제출되었습니다",doneSub:"소중한 의견 감사합니다.\n응답은 안전하게 기록되었습니다.",home:"처음으로",
    missing:n=>`아직 응답하지 않은 필수 문항이 ${n}개 있어요`,max:n=>`최대 ${n}개까지 선택할 수 있어요`,
    sendFail:"전송에 실패했어요. 네트워크를 확인하고 다시 시도해주세요.",
    testbar:"테스트 모드 — 응답이 시트로 전송되지 않습니다 (SCRIPT_URL 미설정)",
    selfree:"직접 입력해주세요",freeph:"자유롭게 적어주세요"},
  agree:["전혀 그렇지 않다","매우 그렇다"],
  intro:{t1:"GP CONNECT 1년,",t2:"함께 돌아보는 시간",

    Q18:{text:"GP 슬랙 채널은 부담 없이 의견을 내고 반응할 수 있는 환경이라고 생각한다."},
    Q19:{text:"GP 슬랙 채널에 올라오는 콘텐츠·이벤트·공지에 어느 정도 반응(이모지·댓글·참여 등)하시나요?",lo:"거의 반응하지 않는다",hi:"자주 반응한다"},

    Q25:{text:"현재 GP의 사내 이벤트(애정고사·슬랙 인증샷·릴레이·뉴스레터 연계 이벤트 등) 운영에 만족한다.",lo:"매우 불만족",hi:"매우 만족"},

const LANG_ORDER=["ko","en","zh","ja"];
const LANG_SHORT={ko:"한국어",en:"EN",zh:"中文",ja:"日本語"};

/* =================== 상태 =================== */
let lang="ko", page=-1, answers={}, startTime=null, timerInt=null, submitting=false;
let mode="survey";            // survey | adminLogin | adminDash
let ALL=[], selOrg="전체", selTen="전체";
const app=document.getElementById("app"), toastEl=document.getElementById("toast");
const T=()=>I18N[lang];
const QT=id=>I18N[lang].q[id];
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){toastEl.textContent=m;toastEl.classList.add("show");clearTimeout(toastEl._t);toastEl._t=setTimeout(()=>toastEl.classList.remove("show"),2400);}
function fmtTime(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function anchors(id){const q=QT(id),a=T().agree;return {lo:q.lo||a[0],hi:q.hi||a[1]};}
function optCount(id){const q=I18N.ko.q[id];return (q.opts||[]).length;}

/* =================== 렌더 라우팅 =================== */
function render(){window.scrollTo(0,0);
  if(mode==="adminLogin")return renderLogin();
  if(mode==="adminDash")return renderDashboardShell();
  if(page===-1)return renderIntro();
  if(page>=STRUCT.length)return renderDone();

}
function langSwitcher(){
  return `<div class="langsw">${LANG_ORDER.map(l=>`<button data-lang="${l}" class="${lang===l?'on':''}">${LANG_SHORT[l]}</button>`).join("")}</div>`;
}
function bindLang(){app.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;document.documentElement.lang=lang;render();});}
function topbar(){
  let nodes="";
  for(let i=0;i<STRUCT.length;i++){const cls=i<page?"done":(i===page?"current":"");nodes+=`<div class="pnode ${cls}"><div class="pdot"></div></div>`;if(i<STRUCT.length-1)nodes+=`<div class="pline"><div class="fill" style="width:${i<page?100:0}%"></div></div>`;}
  const right=startTime!==null?`<span class="timer" id="tmr">${fmtTime(Date.now()-startTime)}</span>`:langSwitcher();
  const prog=(page>=0&&page<STRUCT.length)?`<div class="progress">${nodes}</div>`:"";
  const test=TEST_MODE?`<div class="testbar">${T().ui.testbar}</div>`:"";
  return `<div class="topbar"><div class="topbar-row"><span class="brand"><span class="dot"></span>${T().ui.title}</span>${right}</div>${prog}</div>${test}`;
}
function startTimer(){clearInterval(timerInt);timerInt=setInterval(()=>{const t=document.getElementById("tmr");if(t)t.textContent=fmtTime(Date.now()-startTime);},1000);}

/* =================== 인트로 =================== */

/* =================== 섹션 =================== */
function renderSection(sec){
  const S=T().sec[sec.id];
  let body=`<div class="page"><div class="sec-eyebrow">${S.e}</div><h2 class="sec-title">${S.t}</h2>
    ${S.d?`<p class="sec-desc">${S.d}</p>`:""}
    ${sec.note?`<div class="note">${T().misc.scaleNote}<br><span style="color:var(--ink-faint)">1: ${T().agree[0]} — 5: ${T().agree[1]}</span></div>`:""}`;
  for(const it of sec.items){
    if(it.t==="head"){body+=`<div class="group-head">${T().head[it.key]}</div>`;continue;}
    if(it.t==="q"){if(it.showIf&&!it.showIf(answers))continue;body+=renderQ(it);}
  }
  body+=`</div>`;
  const isLast=page===STRUCT.length-1;
  app.innerHTML=topbar()+body+`<div class="nav"><button class="btn btn-ghost" id="prev">${T().ui.prev}</button><button class="btn btn-primary" id="next">${isLast?T().ui.submit:T().ui.next}</button></div>`;
  bindLang();bindHandlers(sec);
  document.getElementById("prev").onclick=()=>{page--;render();};
  document.getElementById("next").onclick=()=>tryNext(sec);
}
function condNote(id){
  if(id==="Q14_1")return `<div class="cond-note">Q14 → 1~2</div>`;
  if(id==="Q19_1")return `<div class="cond-note">Q19 → 1~2</div>`;
  if(id==="Q31_hq"||id==="Q31_ov")return `<div class="cond-note">Q31</div>`;
  return "";
}
function renderQ(it){
  const q=QT(it.id),v=answers[it.id];let inner="";
  if(it.type==="scale"){const an=anchors(it.id);let b="";for(let n=1;n<=5;n++)b+=`<button data-q="${it.id}" data-v="${n}" class="${v===n?'on':''}">${n}</button>`;inner=`<div class="scale">${b}</div><div class="anchors"><span>${an.lo}</span><span>${an.hi}</span></div>`;}
  else if(it.type==="nps"){const an=anchors(it.id);let b="";for(let n=0;n<=10;n++)b+=`<button data-q="${it.id}" data-v="${n}" class="${v===n?'on':''}">${n}</button>`;inner=`<div class="nps">${b}</div><div class="anchors"><span>${an.lo}</span><span>${an.hi}</span></div>`;}
  else if(it.type==="single"||it.type==="single_other"){const cur=(v&&v.idx!==undefined)?v.idx:v;let o="";
    q.opts.forEach((op,i)=>o+=`<div class="opt ${cur===i?'on':''}" data-qs="${it.id}" data-i="${i}"><span class="tick"></span><span>${op}</span></div>`);
    if(it.other){const oi=q.opts.length,on=cur===oi;o+=`<div class="opt ${on?'on':''}" data-qs="${it.id}" data-i="${oi}"><span class="tick"></span><span>${q.other}</span></div>`;if(on)o+=`<input type="text" class="subinput" data-other="${it.id}" placeholder="${T().ui.selfree}" value="${esc(v&&v.other||'')}">`;}inner=o;}
  else if(it.type==="multi"||it.type==="multi_other"){const arr=Array.isArray(v&&v.list)?v.list:(Array.isArray(v)?v:[]);const atMax=it.max&&arr.length>=it.max;let o="";
    q.opts.forEach((op,i)=>{const on=arr.includes(i);o+=`<div class="opt ${on?'on':''} ${(!on&&atMax)?'disabled':''}" data-qm="${it.id}" data-i="${i}"><span class="tick sq"></span><span>${op}</span></div>`;});
    if(it.other){const oi=q.opts.length,on=arr.includes(oi);o+=`<div class="opt ${on?'on':''} ${(!on&&atMax)?'disabled':''}" data-qm="${it.id}" data-i="${oi}"><span class="tick sq"></span><span>${q.other}</span></div>`;if(on)o+=`<input type="text" class="subinput" data-other="${it.id}" placeholder="${T().ui.selfree}" value="${esc(v&&v.other||'')}">`;}
    if(it.max)o+=`<div class="maxhint">${T().q.Q14.sub?'':''}${(lang==='ko'?'최대 '+it.max+'개 · 현재 '+arr.length+'개':lang==='en'?'Up to '+it.max+' · '+arr.length+' selected':lang==='zh'?'最多'+it.max+'项 · 已选'+arr.length:'最大'+it.max+'個 · 現在'+arr.length+'個')}</div>`;inner=o;}
  else if(it.type==="text")inner=`<textarea data-text="${it.id}" placeholder="${T().ui.freeph}">${esc(v||'')}</textarea>`;
  else if(it.type==="text_one")inner=`<input type="text" data-text="${it.id}" placeholder="${esc(q.ph||'')}" value="${esc(v||'')}">`;
  return `<div class="q" id="card-${it.id}">${condNote(it.id)}<span class="q-num">${qLabel(it.id)}</span>${it.optional?`<span class="q-opt">●</span>`:''}${q.sub?`<span class="q-opt">(${q.sub})</span>`:''}<p class="q-text">${q.text}</p>${q.tip?`<div class="q-tip">${q.tip}</div>`:''}${inner}</div>`;
}
function bindHandlers(sec){
  app.querySelectorAll('[data-q][data-v]').forEach(b=>b.onclick=()=>{answers[b.dataset.q]=Number(b.dataset.v);(b.dataset.q==="Q14"||b.dataset.q==="Q19")?render():renderSection(sec);});
  app.querySelectorAll('[data-qs]').forEach(o=>o.onclick=()=>{const id=o.dataset.qs,i=Number(o.dataset.i),it=findItem(id);if(it.other)answers[id]={idx:i,other:(answers[id]&&answers[id].other)||""};else answers[id]=i;(id==="Q31")?render():renderSection(sec);});
  app.querySelectorAll('[data-qm]').forEach(o=>o.onclick=()=>{if(o.classList.contains("disabled"))return;const id=o.dataset.qm,i=Number(o.dataset.i),it=findItem(id);const cur=answers[id];let arr=Array.isArray(cur&&cur.list)?[...cur.list]:(Array.isArray(cur)?[...cur]:[]);if(arr.includes(i))arr=arr.filter(x=>x!==i);else{if(it.max&&arr.length>=it.max){toast(T().ui.max(it.max));return;}arr.push(i);}if(it.other)answers[id]={list:arr,other:(cur&&cur.other)||""};else answers[id]=arr;renderSection(sec);});
  app.querySelectorAll('[data-other]').forEach(i=>i.oninput=()=>{const id=i.dataset.other,cur=answers[id]||{};answers[id]={...cur,other:i.value};});
  app.querySelectorAll('[data-text]').forEach(i=>i.oninput=()=>{answers[i.dataset.text]=i.value;});
}
function isAnswered(it){const v=answers[it.id];if(v===undefined||v===null||v==="")return false;if(it.type==="single_other")return v.idx!==undefined&&v.idx!==null;if(it.type==="single")return typeof v==="number";if(it.type==="multi"||it.type==="multi_other"){const arr=Array.isArray(v&&v.list)?v.list:(Array.isArray(v)?v:[]);return arr.length>0;}return true;}
async function tryNext(sec){
  if(submitting)return;
  const missing=[];
  for(const it of sec.items){if(it.t!=="q"||it.optional)continue;if(it.showIf&&!it.showIf(answers))continue;if(!isAnswered(it))missing.push(it.id);}
  if(missing.length){app.querySelectorAll(".q").forEach(c=>c.classList.remove("missing"));missing.forEach(id=>{const e=document.getElementById("card-"+id);if(e)e.classList.add("missing");});const f=document.getElementById("card-"+missing[0]);if(f)f.scrollIntoView({behavior:"smooth",block:"center"});toast(T().ui.missing(missing.length));return;}
  if(page===STRUCT.length-1)await submitSurvey();else{page++;render();}
}

/* =================== 정규화(한국어 기준) → 시트 전송 =================== */
function canonical(id){
  const it=findItem(id),v=answers[id],ko=I18N.ko.q[id];
  if(v===undefined||v===null||v==="")return "";
  if(it.type==="scale"||it.type==="nps")return String(v);
  if(it.type==="single")return ko.opts[v]||"";
  if(it.type==="single_other"){const oi=ko.opts.length;return v.idx===oi?`${ko.other}: ${v.other||""}`:(ko.opts[v.idx]||"");}
  if(it.type==="multi"){return (v||[]).map(i=>ko.opts[i]).join(" / ");}
  if(it.type==="multi_other"){const oi=ko.opts.length;return (v.list||[]).map(i=>i===oi?`${ko.other}: ${v.other||""}`:ko.opts[i]).join(" / ");}
  return String(v);
}
function buildPayload(){
  const cols=[];STRUCT.forEach(s=>s.items.forEach(it=>{if(it.t==="q")cols.push(it.id);}));
  return {language:lang,durationSec:Math.round((startTime?Date.now()-startTime:0)/1000),header:cols.map(qLabel),values:cols.map(canonical)};
}
function sendToSheet(payload){
  const body=JSON.stringify(payload);
  // 1순위: sendBeacon (CORS·리다이렉트에 강한 fire-and-forget 전송)
  try{
    if(navigator.sendBeacon && navigator.sendBeacon(SCRIPT_URL,new Blob([body],{type:"text/plain;charset=utf-8"})))
      return Promise.resolve();
  }catch(e){}
  // 2순위: fetch no-cors
  return fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body,keepalive:true});
}
async function submitSurvey(){
  submitting=true;clearInterval(timerInt);
  const btn=document.getElementById("next");if(btn){btn.textContent=T().ui.saving;btn.disabled=true;}
  const payload=buildPayload();
  try{
    if(!TEST_MODE)await sendToSheet(payload);
    else console.log("[TEST MODE] payload:",payload);
    page=STRUCT.length;submitting=false;renderDone();
  }catch(err){
    submitting=false;toast(T().ui.sendFail);
    if(btn){btn.textContent=T().ui.submit;btn.disabled=false;}
  }
}

/* =================== 대시보드 =================== */
function jsonp(url){return new Promise((res,rej)=>{const cb="__cb"+Math.random().toString(36).slice(2);const s=document.createElement("script");window[cb]=d=>{res(d);try{delete window[cb];}catch(e){}s.remove();};s.onerror=()=>{rej(new Error("net"));s.remove();};s.src=url+(url.indexOf("?")>=0?"&":"?")+"callback="+cb;document.body.appendChild(s);});}

async function renderDashboardShell(){
  app.innerHTML=`<div class="topbar"><div class="topbar-row"><span class="brand"><span class="dot"></span>관리자 · 결과 대시보드</span><span class="logout" id="logout">로그아웃</span></div></div>
  <div class="page"><div id="dashbody" style="padding-top:6px;color:var(--ink-soft);font-size:14px">결과 불러오는 중…</div></div>`;

  try{
    const d=await jsonp(SCRIPT_URL+"?key="+encodeURIComponent(DASH_KEY));
    if(!d||!d.ok){document.getElementById("dashbody").innerHTML="데이터를 불러오지 못했습니다. (DASH_KEY / 배포 버전 확인)";return;}
    ALL=d.rows||[];drawDashboard();
  }catch(e){const b=document.getElementById("dashbody");if(b)b.innerHTML="네트워크 오류로 불러오지 못했습니다.";}
}
function filtered(){return ALL.filter(r=>(selOrg==="전체"||(r.a&&r.a.Q1===selOrg))&&(selTen==="전체"||(r.a&&r.a.Q2===selTen)));}

function drawDashboard(){
  const body=document.getElementById("dashbody");if(!body)return;
  const rs=filtered(),n=rs.length;
  const durs=ALL.map(r=>r.dur*1000).filter(x=>x>0);
  const avgDur=durs.length?fmtTime(durs.reduce((a,b)=>a+b,0)/durs.length):"–";

      <div class="nps-legend"><span><i style="background:var(--accent)"></i>추천 ${P}</span><span><i style="background:var(--amber)"></i>중립 ${Pa}</span><span><i style="background:var(--danger)"></i>비추천 ${D}</span></div></div>`;
  }
  const effIds=["Q3","Q4","Q5","Q6","Q7","Q8","Q9","Q10","Q11","Q12"];let effSum=0,effN=0;

  const eff=effN?(effSum/effN).toFixed(2):"–";

  let html=`<div class="dash-cards">
    <div class="dcard"><div class="dl">총 응답 수</div><div class="dn">${ALL.length}</div><div class="ds">목표 ${TARGET}명 · ${rate}%</div></div>
    <div class="dcard"><div class="dl">평균 소요</div><div class="dn">${avgDur}</div><div class="ds">전체 응답 기준</div></div>
    ${npsHtml}
    <div class="dcard"><div class="dl">콘텐츠 효과 평균</div><div class="dn">${eff}<span style="font-size:14px;color:var(--ink-faint)"> /5</span></div><div class="ds">Q3~Q12 평균</div></div>
    <div class="dcard"><div class="dl">필터 응답 수</div><div class="dn">${n}</div><div class="ds">${selOrg}${selTen!=="전체"?" · "+selTen:""}</div></div>
  </div>`;

  const orgs=I18N.ko.q.Q1.opts,tens=I18N.ko.q.Q2.opts;
  html+=`<div class="filters">
    <select id="fOrg"><option>전체</option>${orgs.map(o=>`<option ${selOrg===o?"selected":""}>${o}</option>`).join("")}</select>
    <select id="fTen"><option>전체</option>${tens.map(o=>`<option ${selTen===o?"selected":""}>${o}</option>`).join("")}</select>
  </div>`;

  if(n===0){html+=`<div class="empty-q" style="text-align:center;margin-top:40px;font-size:14px">아직 집계된 응답이 없습니다.<br>설문을 제출하면 여기에 결과가 쌓입니다.</div>`;}
  else{
    STRUCT.forEach(sec=>{
      const sx=I18N.ko.sec[sec.id];
      html+=`<div class="dash-sec">${sx.e==="마지막"?"보상":sx.e} · ${sx.t}</div>`;
      sec.items.forEach(it=>{if(it.t==="q")html+=renderAgg(it,rs);});
    });
  }

  html+=`<div class="dash-actions"><button class="abtn" id="refresh">새로고침</button></div>
  <div class="secnote">집계는 권한 걸린 구글시트에서 실시간으로 불러옵니다. 자유응답 원문·보상 연락처는 보안을 위해 여기 표시되지 않으며 시트에서만 확인할 수 있습니다. 비밀번호는 가벼운 칸막이이며 실제 보안 기능이 아닙니다.</div>`;

  body.innerHTML=html;
  document.getElementById("fOrg").onchange=e=>{selOrg=e.target.value;drawDashboard();};
  document.getElementById("fTen").onchange=e=>{selTen=e.target.value;drawDashboard();};
  document.getElementById("refresh").onclick=()=>renderDashboardShell();
}

function tally(rs,key){const t={};let answered=0;rs.forEach(r=>{const v=r.a&&r.a[key];if(v==null||v==="")return;answered++;String(v).split(" / ").forEach(o=>{o=o.trim();if(!o)return;if(o.indexOf("기타")===0||o.indexOf("그 외")===0)o="기타 (직접입력)";t[o]=(t[o]||0)+1;});});return {t,answered};}

function renderAgg(it,rs){
  const key=qLabel(it.id),q=I18N.ko.q[it.id];
  const head=`<div class="dqn">${key}</div><div class="dqt">${esc(q.text)}</div>`;
  if(it.type==="text"||it.type==="text_one")return ""; // 자유응답·보상 연락처는 시트에서만
  if(it.type==="scale"){
    const vals=rs.map(r=>r.a&&r.a[key]).filter(v=>typeof v==="number");
    if(!vals.length)return `<div class="dq">${head}<div class="empty-q">응답 없음</div></div>`;
    const cnt=[0,0,0,0,0];vals.forEach(v=>cnt[v-1]++);const mean=(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2);
    let bars="";for(let i=5;i>=1;i--){const c=cnt[i-1],pc=Math.round(c/vals.length*100);bars+=`<div class="bar"><div class="bar-l">${i}점</div><div class="bar-track"><div class="bar-fill" style="width:${pc}%"></div></div><div class="bar-v">${c} · ${pc}%</div></div>`;}
    return `<div class="dq">${head}<div class="dqmeta">평균 ${mean} / 5 · 응답 ${vals.length}</div>${bars}</div>`;
  }
  if(it.type==="nps"){
    const vals=rs.map(r=>r.a&&r.a[key]).filter(v=>typeof v==="number");
    if(!vals.length)return `<div class="dq">${head}<div class="empty-q">응답 없음</div></div>`;
    const mean=(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);const cnt={};vals.forEach(v=>cnt[v]=(cnt[v]||0)+1);
    let bars="";for(let i=10;i>=0;i--){const c=cnt[i]||0,pc=Math.round(c/vals.length*100);bars+=`<div class="bar"><div class="bar-l">${i}</div><div class="bar-track"><div class="bar-fill" style="width:${pc}%"></div></div><div class="bar-v">${c} · ${pc}%</div></div>`;}
    return `<div class="dq">${head}<div class="dqmeta">평균 ${mean} / 10 · 응답 ${vals.length}</div>${bars}</div>`;
  }
  // 객관식 / 복수응답
  const {t,answered}=tally(rs,key);
  if(!answered)return `<div class="dq">${head}<div class="empty-q">응답 없음</div></div>`;
  const labels=(q.opts||[]).slice();if(q.other)labels.push("기타 (직접입력)");
  const multi=(it.type==="multi"||it.type==="multi_other");
  let bars="";labels.forEach(op=>{const c=t[op]||0;const pc=Math.round(c/answered*100);bars+=`<div class="bar"><div class="bar-l wide">${esc(op)}</div><div class="bar-track"><div class="bar-fill" style="width:${pc}%"></div></div><div class="bar-v">${c} · ${pc}%</div></div>`;});
  return `<div class="dq">${head}<div class="dqmeta">응답 ${answered}명${multi?" · 복수응답":""}</div>${bars}</div>`;
}

render();
</script>
</body>
</html>
